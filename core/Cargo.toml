[package]
name = "s3-rdma"
version = "0.2.0"
edition = "2021"
description = "SDK-agnostic RDMA provider abstractions for S3 object storage"
license = "MIT"

[features]
# Enable runtime loading of the cuObject RDMA client provider plugin
# (libs3rdmacuobjclient.so).  Built from the s3-rdma-cuobj-client crate.
# No compile-time dependency on the cuObject SDK is required.
cuobj-client = ["dep:libloading"]
# Enable runtime loading of the cuObject RDMA server provider plugin
# (libs3rdmacuobjserver.so).  Built from the s3-rdma-cuobj-server crate.
# No compile-time dependency on the cuObject SDK or hsg-io is required.
cuobj-server = ["dep:libloading"]
# Export C-ABI vtable entry point (for use as a cdylib plugin from C code)
c-abi    = []
# Python bindings via PyO3 (build with maturin from the python/ directory)
pyo3     = ["dep:pyo3", "pyo3/extension-module"]
# Generic pre-registered RDMA buffer pool (works with any RdmaProvider:
# bytes/mock/cuobj).  Adds crossbeam-queue and tokio::sync deps.
buffer-pool = ["dep:crossbeam-queue", "dep:tokio"]

[dependencies]
libc          = "0.2"
libloading    = { version = "0.8", optional = true }
pyo3          = { version = "0.22", optional = true }
crossbeam-queue = { version = "0.3", optional = true }
tokio         = { version = "1", features = ["sync", "time", "rt"], optional = true }

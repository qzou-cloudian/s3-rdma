[package]
name        = "s3-rdma-cuobj-client"
version     = "0.2.0"
edition     = "2021"
description = "cuObject RDMA client provider plugin for S3 clients (cdylib)"
license     = "MIT"

[lib]
name       = "s3_rdma_cuobj_client"
crate-type = ["cdylib"]

[dependencies]
s3-rdma = { path = "../../core" }
cuobj   = { path = "../../../cuobj", features = ["client"] }

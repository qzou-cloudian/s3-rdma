[package]
name        = "s3-rdma-cuobj-server"
version     = "0.2.0"
edition     = "2021"
description = "cuObject RDMA server provider plugin for S3 gateways (cdylib)"
license     = "MIT"

[lib]
name       = "s3_rdma_cuobj_server"
crate-type = ["cdylib"]

[dependencies]
s3-rdma = { path = "../../core" }
hsg-io  = { path = "../../../../hsg/crates/hsg-io", features = ["buffer-pool", "server"] }
cuobj   = { path = "../../../../cuobj", features = ["server"] }

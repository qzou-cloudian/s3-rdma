[package]
name        = "s3-rdma-server"
version     = "0.3.0"
edition     = "2021"
description = "RDMA server provider plugin for S3 gateways (cdylib)"
license     = "MIT"

[lib]
name       = "s3rdmaserver"
crate-type = ["cdylib"]

[features]
# Mock provider (shared-memory simulation, no hardware required)
default = ["mock"]
mock    = []
# cuObject RDMA hardware backend
cuobj   = ["dep:cuobj"]

[dependencies]
tracing = "0.1"
s3-rdma = { path = "../.." }
cuobj   = { path = "../../../cuobj", features = ["server"], optional = true }

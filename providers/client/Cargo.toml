[package]
name        = "s3-rdma-client"
version     = "0.3.0"
edition     = "2021"
description = "RDMA client provider plugin for S3 clients (cdylib)"
license     = "MIT"

[lib]
name       = "s3rdmaclient"
crate-type = ["cdylib"]

[features]
# Mock provider (shared-memory simulation, no hardware required)
default = ["mock"]
mock    = []
# cuObject RDMA hardware backend
cuobj   = ["dep:cuobj", "dep:cuobj-sys"]

[dependencies]
tracing            = "0.1"
tracing-subscriber = "0.3"
libc               = "0.2"
s3-rdma            = { path = "../.." }
cuobj              = { path = "../../../cuobj",          features = ["client"], optional = true }
cuobj-sys          = { path = "../../../cuobj/cuobj-sys", features = ["client"], optional = true }

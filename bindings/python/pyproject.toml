[build-system]
requires      = ["maturin>=1.4,<2"]
build-backend = "maturin"

[project]
name    = "s3-rdma"
version = "0.2.0"
description = "GPU-Direct RDMA provider for S3 object storage — Python bindings"
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: System :: Networking",
]

[tool.maturin]
# Build the `s3-rdma` Rust crate as a Python extension module via PyO3.
manifest-path = "../../core/Cargo.toml"
features      = ["pyo3"]
module-name   = "s3_rdma"
python-source = "src"

[package]
name        = "s3-rdma-jni"
version     = "0.2.0"
edition     = "2021"
description = "JNI bindings for the s3-rdma RDMA provider (Java)"
license     = "MIT"

[lib]
name       = "s3rdmajni"
crate-type = ["cdylib"]

[features]
# Forward plugin features to the core crate so the JNI library can load
# the RDMA plugins at runtime.
rdma-client = ["s3-rdma/rdma-client"]
rdma-server = ["s3-rdma/rdma-server"]

[dependencies]
s3-rdma = { path = "../../core" }
jni     = { version = "0.21" }

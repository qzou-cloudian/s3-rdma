[package]
name        = "s3-rdma-jni"
version     = "0.2.0"
edition     = "2021"
description = "JNI bindings for the s3-rdma RDMA provider (Java)"
license     = "MIT"

[lib]
name       = "s3_rdma_jni"
crate-type = ["cdylib"]

[dependencies]
s3-rdma = { path = "../../core" }
jni     = { version = "0.21" }
